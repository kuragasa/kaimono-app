<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>買いたいものアプリ</title>
  
　<link rel="apple-touch-icon" href="https://fav.farm/🛒">
  <link rel="icon" href="https://fav.farm/🛒">
  
  <style>
    /* ＝＝＝ ↓お化粧（CSS）のルールブック（前回と同じです）↓ ＝＝＝ */
    body {
      background-color: #fff9f5; 
      color: #555555; 
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      padding: 15px; 
      max-width: 500px; 
      margin: 0 auto; 
    }

    h1 {
      font-size: 24px; 
      text-align: center; 
      color: #ff9a9e; 
      border-bottom: 2px dashed #ff9a9e; 
      padding-bottom: 10px;
    }

    .heading-summary {
      font-size: 20px; 
      color: #a18cd1;
      margin-top: 25px;
      margin-bottom: 10px;
      cursor: pointer; 
      font-weight: bold;
      border-bottom: 2px dashed #e8dff5; 
      padding-bottom: 5px;
    }

    .photo-summary {
      font-size: 15px; 
      color: #ffb199;
      cursor: pointer;
      margin-top: 10px;
      font-weight: bold;
    }

    input[type="text"] {
      width: 60%;
      padding: 12px;
      border: 2px solid #fbc2eb; 
      border-radius: 20px; 
      outline: none; 
      font-size: 16px; 
    }

    button {
      background-color: #ffb199; 
      color: white; 
      border: none; 
      padding: 12px 18px;
      border-radius: 20px; 
      font-size: 15px;
      font-weight: bold; 
      box-shadow: 0px 4px 0px #f0957d; 
      cursor: pointer; 
      margin-right: 5px;
      margin-bottom: 5px;
    }
    
    .delete-btn {
      background-color: #ff7b7b; 
      box-shadow: 0px 4px 0px #d46363; 
    }

    button:active {
      transform: translateY(4px);
      box-shadow: none;
    }

    ul {
      list-style-type: none; 
      padding: 0;
    }
    
    li {
      background-color: white; 
      padding: 18px 15px;
      margin-bottom: 12px;
      border-radius: 12px; 
      box-shadow: 0px 2px 5px rgba(0,0,0,0.05); 
      font-size: 16px; 
      line-height: 1.5; 
    }

    .item-image {
      max-width: 100%; 
      height: auto;
      display: block;
      margin-top: 10px;
      border-radius: 8px; 
    }
  </style>

</head>
<body>

  <h1>お買い物リスト📝</h1>
  
  <div style="text-align: center; margin-bottom: 25px;">
    <input type="text" id="itemInput" placeholder="何を買う？">
    <button id="addButton">追加！</button>
  </div>

  <input type="file" accept="image/*" capture="environment" id="cameraInput" style="display: none;">

  <details open>
    <summary class="heading-summary">買うものリスト🛒</summary>
    <ul id="wantList"></ul>
  </details>

  <details>
    <summary class="heading-summary">購入済み✨</summary>
    <ul id="boughtList"></ul>
  </details>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCu1fY1gC6QlBrtB4n-jxZCRreD81xwKq4",
      authDomain: "kaimono-app-1fb70.firebaseapp.com",
      projectId: "kaimono-app-1fb70",
      storageBucket: "kaimono-app-1fb70.firebasestorage.app",
      messagingSenderId: "340367566014",
      appId: "1:340367566014:web:127208a9b4ef5ae74f6aef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const button = document.getElementById("addButton");
    const input = document.getElementById("itemInput");
    const list = document.getElementById("wantList");
    const boughtList = document.getElementById("boughtList");
    const cameraInput = document.getElementById("cameraInput"); 

    let currentTargetName = "";
    let currentTargetId = "";

    onSnapshot(collection(db, "wantItems"), (snapshot) => {
      list.innerHTML = ""; 

      snapshot.forEach((documentSnapshot) => {
        const data = documentSnapshot.data();
        const noteId = documentSnapshot.id; 

        const newItem = document.createElement("li");
        
        const textSpan = document.createElement("span");
        textSpan.textContent = data.name;
        textSpan.style.display = "block"; 
        textSpan.style.marginBottom = "10px"; 
        textSpan.style.fontWeight = "bold"; 
        newItem.appendChild(textSpan);

        const buyButton = document.createElement("button");
        buyButton.textContent = "買いました！📸";
        
        buyButton.addEventListener("click", async function() {
          currentTargetName = data.name; 
          currentTargetId = noteId;      
          
          const wantPhoto = confirm("「" + data.name + "」を買ったんですね！🎉\n一緒に写真も保存しますか？\n\n【OK】写真を撮る📷\n【キャンセル】写真なしで移動✨");

          if (wantPhoto) {
            cameraInput.click(); 
          } else {
            // ★日付スタンプの魔法！★ スマホの時計を見て、今日の日付（例：2026/9/20）を作ります
            const today = new Date().toLocaleDateString('ja-JP'); 

            try {
              await addDoc(collection(db, "boughtItems"), {
                name: currentTargetName,
                date: today // ← ここで日付スタンプを一緒に保存！
              });
              await deleteDoc(doc(db, "wantItems", currentTargetId)); 
            } catch (error) {
              alert("保存に失敗しちゃいました…。");
            }
          }
        });

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "削除🗑️";
        deleteButton.className = "delete-btn"; 
        
        deleteButton.addEventListener("click", async function() {
          const ok = confirm(data.name + " をリストから消してもいいですか？");
          if (ok) {
            await deleteDoc(doc(db, "wantItems", noteId));
          }
        });

        newItem.appendChild(buyButton);
        newItem.appendChild(deleteButton); 
        list.appendChild(newItem);
      });
    });

    cameraInput.addEventListener("change", function(event) {
      const file = event.target.files[0];
      if (!file) return; 

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = async function() {
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");
          const MAX_WIDTH = 400; 
          const scaleSize = MAX_WIDTH / img.width;
          canvas.width = MAX_WIDTH;
          canvas.height = img.height * scaleSize;
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          
          const base64Image = canvas.toDataURL("image/jpeg", 0.7);

          // ★写真を選ぶ場合も、日付スタンプを作ります！★
          const today = new Date().toLocaleDateString('ja-JP');

          try {
            await addDoc(collection(db, "boughtItems"), {
              name: currentTargetName,
              image: base64Image,
              date: today // ← 写真と一緒に日付スタンプも保存！
            });
            await deleteDoc(doc(db, "wantItems", currentTargetId));
            cameraInput.value = "";
          } catch (error) {
            alert("写真の保存に失敗しました…");
          }
        }
        img.src = e.target.result;
      }
      reader.readAsDataURL(file);
    });

    onSnapshot(collection(db, "boughtItems"), (snapshot) => {
      boughtList.innerHTML = ""; 

      snapshot.forEach((documentSnapshot) => {
        const data = documentSnapshot.data();
        const noteId = documentSnapshot.id; 

        const newItem = document.createElement("li");
        
        const textSpan = document.createElement("div");
        textSpan.textContent = "✅ " + data.name;
        textSpan.style.fontWeight = "bold";
        newItem.appendChild(textSpan);
        
        // ★日付スタンプが押されていれば、画面に表示する魔法★
        if (data.date) {
          const dateSpan = document.createElement("div");
          dateSpan.textContent = "📅 購入日: " + data.date;
          dateSpan.style.fontSize = "13px"; // 少し小さめの文字で
          dateSpan.style.color = "#999999"; // 少し薄いグレー色にして控えめに
          dateSpan.style.marginTop = "5px"; // 上の文字との隙間
          newItem.appendChild(dateSpan);
        }

        if (data.image) {
          const detailsBox = document.createElement("details");
          const photoSummary = document.createElement("summary");
          photoSummary.textContent = "写真を見る📷";
          photoSummary.className = "photo-summary";
          
          const imgElement = document.createElement("img");
          imgElement.src = data.image; 
          imgElement.className = "item-image"; 
          
          detailsBox.appendChild(photoSummary);
          detailsBox.appendChild(imgElement);
          newItem.appendChild(detailsBox);
        }

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "削除🗑️";
        deleteButton.className = "delete-btn";
        deleteButton.style.marginTop = "10px"; 
        
        deleteButton.addEventListener("click", async function() {
          const ok = confirm("この履歴を完全に消してもいいですか？");
          if (ok) {
            await deleteDoc(doc(db, "boughtItems", noteId));
          }
        });
        
        newItem.appendChild(deleteButton);
        boughtList.appendChild(newItem);
      });
    });

    button.addEventListener("click", async function() {
      const text = input.value;
      if (text === "") { return; }
      try {
        await addDoc(collection(db, "wantItems"), { name: text });
        input.value = "";
      } catch (error) {
        alert("保存に失敗しちゃいました…。");
      }
    });
  </script>

</body>
</html>
