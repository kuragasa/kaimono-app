<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>買いたいものアプリ</title>
  <style>
    /* 写真をきれいに表示するための少しのお化粧（CSS）です */
    .item-image {
      max-width: 150px;
      display: block;
      margin-top: 5px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>私の買いたいものリスト📝</h1>
  
  <input type="text" id="itemInput" placeholder="何を買う？">
  <button id="addButton">リストに追加！</button>

  <!-- ↓画面には見えない、隠しカメラボタンです！↓ -->
  <input type="file" accept="image/*" capture="environment" id="cameraInput" style="display: none;">

  <h2>これから買うもの🛒</h2>
  <ul id="wantList"></ul>

  <h2>もう買ったもの✨</h2>
  <ul id="boughtList"></ul>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    // あなたの保管庫の合い鍵
    const firebaseConfig = {
      apiKey: "AIzaSyCu1fY1gC6QlBrtB4n-jxZCRreD81xwKq4",
      authDomain: "kaimono-app-1fb70.firebaseapp.com",
      projectId: "kaimono-app-1fb70",
      storageBucket: "kaimono-app-1fb70.firebasestorage.app",
      messagingSenderId: "340367566014",
      appId: "1:340367566014:web:127208a9b4ef5ae74f6aef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const button = document.getElementById("addButton");
    const input = document.getElementById("itemInput");
    const list = document.getElementById("wantList");
    const boughtList = document.getElementById("boughtList");
    const cameraInput = document.getElementById("cameraInput"); // 隠しカメラ

    // いま「買いました！」を押したアイテムを覚えておくためのメモ帳
    let currentTargetName = "";
    let currentTargetId = "";

    // ★これから買うものを見張るカメラ★
    onSnapshot(collection(db, "wantItems"), (snapshot) => {
      list.innerHTML = ""; 

      snapshot.forEach((documentSnapshot) => {
        const data = documentSnapshot.data();
        const noteId = documentSnapshot.id; 

        const newItem = document.createElement("li");
        newItem.textContent = data.name + " "; 

        const buyButton = document.createElement("button");
        buyButton.textContent = "買いました！📸";

        // 「買いました！」が押されたら…
        buyButton.addEventListener("click", function() {
          currentTargetName = data.name; // 名前を覚えておく
          currentTargetId = noteId;      // 背番号を覚えておく
          
          // 裏に隠してあるカメラボタンをこっそり押す魔法！
          // （これでスマホのカメラや写真選び画面が開きます）
          cameraInput.click(); 
        });

        newItem.appendChild(buyButton);
        list.appendChild(newItem);
      });
    });

    // ★隠しカメラで写真が選ばれた時の動き（ここが魔法の縮小マシンです！）★
    cameraInput.addEventListener("change", function(event) {
      const file = event.target.files[0];
      if (!file) return; // キャンセルされたら何もしない

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = async function() {
          // 画用紙（キャンバス）を用意して、写真を小さなサイズで書き写す
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");
          const MAX_WIDTH = 300; // このサイズにギュッと縮小します
          const scaleSize = MAX_WIDTH / img.width;
          canvas.width = MAX_WIDTH;
          canvas.height = img.height * scaleSize;
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          
          // 小さくなった写真を「文字の暗号（シール）」に変換！
          const base64Image = canvas.toDataURL("image/jpeg", 0.7);

          try {
            // 買ったものノートに「名前」と「写真の暗号」を保存
            await addDoc(collection(db, "boughtItems"), {
              name: currentTargetName,
              image: base64Image
            });
            // 古いノートからはがす
            await deleteDoc(doc(db, "wantItems", currentTargetId));
            
            // 次のためにカメラをリセット
            cameraInput.value = "";
          } catch (error) {
            alert("写真の保存に失敗しました…");
          }
        }
        img.src = e.target.result;
      }
      reader.readAsDataURL(file);
    });

    // ★もう買ったものを見張るカメラ★
    onSnapshot(collection(db, "boughtItems"), (snapshot) => {
      boughtList.innerHTML = ""; 

      snapshot.forEach((documentSnapshot) => {
        const data = documentSnapshot.data();
        const newItem = document.createElement("li");
        newItem.textContent = "✅ " + data.name; 
        
        // もし写真（シール）が貼ってあったら、画像として表示する魔法！
        if (data.image) {
          const imgElement = document.createElement("img");
          imgElement.src = data.image; // 暗号を画像に戻す
          imgElement.className = "item-image"; // 少しお化粧
          newItem.appendChild(imgElement);
        }
        
        boughtList.appendChild(newItem);
      });
    });

    // リストに追加ボタン
    button.addEventListener("click", async function() {
      const text = input.value;
      if (text === "") { return; }
      try {
        await addDoc(collection(db, "wantItems"), { name: text });
        input.value = "";
      } catch (error) {
        alert("保存に失敗しちゃいました…。");
      }
    });
  </script>

</body>
</html>
