<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>買いたいものアプリ</title>
  
  <style>
    /* ＝＝＝ ↓ここから下が「お化粧（CSS）」のルールブックです！↓ ＝＝＝ */
    
    /* ① 画面全体（壁紙と文字のスタイル） */
    body {
      background-color: #fff9f5; /* ほんのり優しいオレンジベージュ */
      color: #555555; /* 真っ黒じゃなくて、少し柔らかいグレーの文字 */
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; /* すっきりした文字の形 */
      padding: 20px; /* 画面の端っこに少しゆとりを持たせる */
      max-width: 500px; /* パソコンで見ても、スマホくらいの幅でスッキリ見せる */
      margin: 0 auto; /* 画面を真ん中に寄せる */
    }

    /* ② タイトルや見出し */
    h1 {
      font-size: 22px;
      text-align: center; /* 真ん中揃え */
      color: #ff9a9e; /* 可愛いピンク系 */
      border-bottom: 2px dashed #ff9a9e; /* 下に点線を引く */
      padding-bottom: 10px;
    }
    h2 {
      font-size: 18px;
      color: #a18cd1; /* 少し大人っぽいふんわりパープル */
      margin-top: 30px;
    }

    /* ③ 入力する枠 */
    input[type="text"] {
      width: 55%;
      padding: 10px;
      border: 2px solid #fbc2eb; /* 枠線を可愛い色に */
      border-radius: 20px; /* 角を丸く！ */
      outline: none; 
      font-size: 16px;
    }

    /* ④ ポチッと押すボタンたち */
    button {
      background-color: #ffb199; /* 優しいサーモンピンク */
      color: white; /* 文字は白 */
      border: none; /* 枠線をなくす */
      padding: 10px 15px;
      border-radius: 20px; /* 角を丸く！ */
      font-size: 14px;
      font-weight: bold; /* 文字を少し太く */
      box-shadow: 0px 4px 0px #f0957d; /* 下に影をつけて、ぷっくりした立体感を出す */
      cursor: pointer; 
      margin-left: 5px;
    }
    
    /* ボタンが押された時の動き（凹んだように見せる！） */
    button:active {
      transform: translateY(4px);
      box-shadow: none;
    }

    /* ⑤ 買いたいもの、買ったものが並ぶ棚（リスト） */
    ul {
      list-style-type: none; /* 先頭の「・」を消すすっきり魔法 */
      padding: 0;
    }
    li {
      background-color: white; /* リストの背景は真っ白なカード風に */
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 12px; /* カードの角も丸く */
      box-shadow: 0px 2px 5px rgba(0,0,0,0.05); /* うっすら影をつけて浮かせる */
    }

    /* 写真をきれいに表示するための設定 */
    .item-image {
      max-width: 150px; 
      display: block;
      margin-top: 10px;
      border-radius: 8px; /* 写真の角も少し丸く */
    }

    /* ＝＝＝ ↑お化粧のルールはここまで！↑ ＝＝＝ */
  </style>

</head>
<body>

  <h1>私の買いたいものリスト📝</h1>
  
  <!-- 入力エリアを少しスッキリまとめるための透明な箱 -->
  <div style="text-align: center; margin-bottom: 20px;">
    <input type="text" id="itemInput" placeholder="何を買う？">
    <button id="addButton">追加！</button>
  </div>

  <!-- ↓隠しカメラボタン↓ -->
  <input type="file" accept="image/*" capture="environment" id="cameraInput" style="display: none;">

  <h2>これから買うもの🛒</h2>
  <ul id="wantList"></ul>

  <h2>もう買ったもの✨</h2>
  <ul id="boughtList"></ul>

  <!-- ↓ここから下は、前回完璧に完成した裏側の魔法です！（そのままです）↓ -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCu1fY1gC6QlBrtB4n-jxZCRreD81xwKq4",
      authDomain: "kaimono-app-1fb70.firebaseapp.com",
      projectId: "kaimono-app-1fb70",
      storageBucket: "kaimono-app-1fb70.firebasestorage.app",
      messagingSenderId: "340367566014",
      appId: "1:340367566014:web:127208a9b4ef5ae74f6aef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const button = document.getElementById("addButton");
    const input = document.getElementById("itemInput");
    const list = document.getElementById("wantList");
    const boughtList = document.getElementById("boughtList");
    const cameraInput = document.getElementById("cameraInput"); 

    let currentTargetName = "";
    let currentTargetId = "";

    onSnapshot(collection(db, "wantItems"), (snapshot) => {
      list.innerHTML = ""; 

      snapshot.forEach((documentSnapshot) => {
        const data = documentSnapshot.data();
        const noteId = documentSnapshot.id; 

        const newItem = document.createElement("li");
        
        // 文字とボタンの間を少し開けるための工夫
        const textSpan = document.createElement("span");
        textSpan.textContent = data.name;
        textSpan.style.marginRight = "10px";
        newItem.appendChild(textSpan);

        const buyButton = document.createElement("button");
        buyButton.textContent = "買いました！📸";

        buyButton.addEventListener("click", function() {
          currentTargetName = data.name; 
          currentTargetId = noteId;      
          cameraInput.click(); 
        });

        newItem.appendChild(buyButton);
        list.appendChild(newItem);
      });
    });

    cameraInput.addEventListener("change", function(event) {
      const file = event.target.files[0];
      if (!file) return; 

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = async function() {
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");
          const MAX_WIDTH = 300; 
          const scaleSize = MAX_WIDTH / img.width;
          canvas.width = MAX_WIDTH;
          canvas.height = img.height * scaleSize;
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          
          const base64Image = canvas.toDataURL("image/jpeg", 0.7);

          try {
            await addDoc(collection(db, "boughtItems"), {
              name: currentTargetName,
              image: base64Image
            });
            await deleteDoc(doc(db, "wantItems", currentTargetId));
            cameraInput.value = "";
          } catch (error) {
            alert("写真の保存に失敗しました…");
          }
        }
        img.src = e.target.result;
      }
      reader.readAsDataURL(file);
    });

    onSnapshot(collection(db, "boughtItems"), (snapshot) => {
      boughtList.innerHTML = ""; 

      snapshot.forEach((documentSnapshot) => {
        const data = documentSnapshot.data();
        const newItem = document.createElement("li");
        
        // 買ったものの文字
        const textSpan = document.createElement("div");
        textSpan.textContent = "✅ " + data.name;
        newItem.appendChild(textSpan);
        
        if (data.image) {
          const imgElement = document.createElement("img");
          imgElement.src = data.image; 
          imgElement.className = "item-image"; 
          newItem.appendChild(imgElement);
        }
        
        boughtList.appendChild(newItem);
      });
    });

    button.addEventListener("click", async function() {
      const text = input.value;
      if (text === "") { return; }
      try {
        await addDoc(collection(db, "wantItems"), { name: text });
        input.value = "";
      } catch (error) {
        alert("保存に失敗しちゃいました…。");
      }
    });
  </script>

</body>
</html>
